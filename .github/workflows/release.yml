name: Release

on:
  push:
    tags: ['v*']

# The GITHUB_TOKEN creates the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test the version derivation
        run: ./gradlew -p buildSrc test

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Gradle fails on a tag outside vMAJOR.MINOR.PATCH (spec.md §6).
      - name: Run JVM tests and build the Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew testDebugUnitTest assembleRelease -PreleaseTag="$GITHUB_REF_NAME"

      # Without the signing secrets Gradle writes app-release-unsigned.apk, so the copy fails.
      - name: Verify the signature and write the checksum
        run: |
          APK="bitcoin-alert-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="bitcoin-alert-$GITHUB_REF_NAME.apk"
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --verify-tag --generate-notes $PRERELEASE
